<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter-container">

        <section class="converter-card">

            <header class="converter-header">
                <h1>Temperature Converter</h1>
                <p>Convert temperatures between Celsius, Fahrenheit, and Kelvin.</p>
            </header>


            <div class="converter-form">

                <!-- Temperature Input -->
                <div class="input-group">
                    <label for="temperature">Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature"
                        step="any"
                    >
                </div>


                <!-- Input Unit -->
                <div class="input-group">
                    <label for="unit">Input Unit</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>


                <!-- Error Message -->
                <p id="error-message" class="error-message"></p>


                <!-- Convert Button -->
                <button id="convert-btn" type="button">
                    Convert Temperature
                </button>

            </div>


            <!-- Results -->
            <section class="results-section">

                <h2>Conversion Results</h2>

                <div class="results-grid">

                    <div class="result-card">
                        <span class="result-label">Celsius</span>
                        <strong id="celsius-result">-- °C</strong>
                    </div>

                    <div class="result-card">
                        <span class="result-label">Fahrenheit</span>
                        <strong id="fahrenheit-result">-- °F</strong>
                    </div>

                    <div class="result-card">
                        <span class="result-label">Kelvin</span>
                        <strong id="kelvin-result">-- K</strong>
                    </div>

                </div>

            </section>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
